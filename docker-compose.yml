version: "3.8"

services:
  netheal-agent:
    build: .
    image: netheal-agent:latest
    container_name: netheal-agent
    ports:
      - "7788:7788"
    volumes:
      # Mount .env for API key configuration
      - ./.env:/app/.env:ro
      # Persist workspace data (reports, logs, database)
      - ./work_space:/app/work_space
    environment:
      - ENVIRONMENT=production
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7788/api/netheal/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
