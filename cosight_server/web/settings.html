<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 配置 · NetHeal Agent</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./libs/fontawesome-6.7.2/css/all.min.css">
  <style>
    :root {
      --bg: #050c16;
      --panel: rgba(10, 25, 42, 0.95);
      --line: rgba(127, 177, 214, 0.14);
      --text: #edf7ff;
      --muted: #8199ad;
      --cyan: #29d8ff;
      --green: #39e7a5;
      --red: #ff607d;
      --amber: #ffbd59;
      --violet: #9e82ff;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 20% -10%, rgba(25,119,172,0.18), transparent 35%),
                  radial-gradient(circle at 90% 20%, rgba(67,55,163,0.14), transparent 30%),
                  linear-gradient(150deg, #050c16 0%, #07111e 45%, #050c15 100%);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 20, 34, 0.85);
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
    }
    .brand i { color: var(--cyan); font-size: 22px; }
    .brand strong { font-size: 16px; letter-spacing: 0.3px; }
    .brand em { font-style: normal; color: var(--cyan); }
    .brand small { display: block; color: var(--muted); font-size: 10px; }
    .nav-links { display: flex; gap: 14px; }
    .nav-links a {
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
      transition: 160ms;
    }
    .nav-links a:hover { border-color: rgba(41,216,255,0.3); color: var(--cyan); }
    .nav-links a.active { border-color: rgba(41,216,255,0.35); color: var(--cyan); background: rgba(41,216,255,0.08); }

    main {
      flex: 1;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .section {
      margin-bottom: 28px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 650;
    }
    .section-title i { color: var(--cyan); font-size: 16px; }

    .form-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .form-row label {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }
    .form-row input, .form-row select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid rgba(127,177,214,0.15);
      border-radius: 7px;
      color: var(--text);
      font-size: 13px;
      font-family: "JetBrains Mono", Consolas, monospace;
      background: rgba(7,20,33,0.7);
      outline: none;
      transition: 160ms;
    }
    .form-row input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(41,216,255,0.08); }
    .form-row .hint {
      grid-column: 2;
      color: #577489;
      font-size: 10px;
      margin-top: -6px;
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 10px 22px;
      border: 1px solid transparent;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 160ms;
    }
    .btn-primary {
      color: #031018;
      background: linear-gradient(135deg, #44e4ff, #27c6f8);
      box-shadow: 0 6px 20px rgba(39,198,248,0.15);
    }
    .btn-primary:hover { box-shadow: 0 8px 28px rgba(39,198,248,0.28); transform: translateY(-1px); }
    .btn-ghost {
      border-color: var(--line);
      color: var(--muted);
      background: transparent;
    }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.18); color: white; }
    .btn-danger {
      border-color: rgba(255,96,125,0.2);
      color: var(--red);
      background: rgba(255,96,125,0.06);
    }
    .btn-danger:hover { border-color: rgba(255,96,125,0.4); background: rgba(255,96,125,0.1); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
    }
    .status-ok { border: 1px solid rgba(57,231,165,0.25); color: var(--green); background: rgba(57,231,165,0.08); }
    .status-warn { border: 1px solid rgba(255,189,89,0.25); color: var(--amber); background: rgba(255,189,89,0.08); }
    .status-error { border: 1px solid rgba(255,96,125,0.25); color: var(--red); background: rgba(255,96,125,0.08); }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      animation: slideIn 200ms ease-out;
    }
    .toast-success { border: 1px solid rgba(57,231,165,0.3); color: var(--green); background: rgba(10,27,44,0.98); }
    .toast-error { border: 1px solid rgba(255,96,125,0.3); color: var(--red); background: rgba(10,27,44,0.98); }

    .env-path {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      color: #577489;
      font: 11px/1.4 "JetBrains Mono", Consolas, monospace;
      background: rgba(7,20,33,0.5);
    }

    @keyframes slideIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: translateX(0); } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./netheal.html">
      <i class="fa-solid fa-wave-square"></i>
      <span>
        <strong>NETHEAL <em>AGENT</em></strong>
        <small>5G PRIVATE NETWORK AIOPS</small>
      </span>
    </a>
    <nav class="nav-links">
      <a href="./netheal.html"><i class="fa-solid fa-gauge"></i> 驾驶舱</a>
      <a href="./settings.html" class="active"><i class="fa-solid fa-gear"></i> API 配置</a>
      <a href="./"><i class="fa-solid fa-diagram-project"></i> Co-Sight</a>
    </nav>
  </header>

  <main>
    <h1>API 配置</h1>
    <p class="subtitle">配置大模型接口和搜索引擎 API Key。修改后需重启服务生效。</p>

    <form id="config-form">
      <!-- 大模型配置 -->
      <div class="section">
        <div class="section-title"><i class="fa-solid fa-brain"></i> 大模型配置</div>

        <div class="form-row">
          <label for="API_KEY">API Key</label>
          <input id="API_KEY" name="API_KEY" type="password" placeholder="sk-..." autocomplete="off">
        </div>
        <p class="hint">支持 OpenAI 兼容接口（DeepSeek、通义千问、GLM 等）</p>

        <div class="form-row">
          <label for="API_BASE_URL">API 地址</label>
          <input id="API_BASE_URL" name="API_BASE_URL" placeholder="https://api.deepseek.com/v1">
        </div>

        <div class="form-row">
          <label for="MODEL_NAME">模型名称</label>
          <input id="MODEL_NAME" name="MODEL_NAME" placeholder="deepseek-chat">
        </div>

        <div class="form-row">
          <label for="MAX_TOKENS">最大 Token</label>
          <input id="MAX_TOKENS" name="MAX_TOKENS" placeholder="4096">
        </div>

        <div class="form-row">
          <label for="TEMPERATURE">Temperature</label>
          <input id="TEMPERATURE" name="TEMPERATURE" placeholder="0.0">
        </div>

        <div class="form-row">
          <label for="LLM_TIMEOUT">超时 (秒)</label>
          <input id="LLM_TIMEOUT" name="LLM_TIMEOUT" placeholder="60">
        </div>

        <div class="form-row">
          <label for="PROXY">代理地址</label>
          <input id="PROXY" name="PROXY" placeholder="留空则不使用代理">
        </div>
        <p class="hint">如 http://127.0.0.1:7897，留空则直连</p>
      </div>

      <!-- 搜索引擎配置 -->
      <div class="section">
        <div class="section-title"><i class="fa-solid fa-magnifying-glass"></i> 搜索引擎配置（可选）</div>

        <div class="form-row">
          <label for="TAVILY_API_KEY">Tavily API Key</label>
          <input id="TAVILY_API_KEY" name="TAVILY_API_KEY" type="password" placeholder="tvly-..." autocomplete="off">
        </div>

        <div class="form-row">
          <label for="GOOGLE_API_KEY">Google API Key</label>
          <input id="GOOGLE_API_KEY" name="GOOGLE_API_KEY" type="password" placeholder="AIza..." autocomplete="off">
        </div>

        <div class="form-row">
          <label for="SEARCH_ENGINE_ID">搜索引擎 ID</label>
          <input id="SEARCH_ENGINE_ID" name="SEARCH_ENGINE_ID" placeholder="c772a0ebd8e3a438d">
        </div>
      </div>

      <!-- 其他 -->
      <div class="section">
        <div class="section-title"><i class="fa-solid fa-sliders"></i> 其他设置</div>

        <div class="form-row">
          <label for="TURBO_MODE">急速模式</label>
          <select id="TURBO_MODE" name="TURBO_MODE">
            <option value="False">关闭</option>
            <option value="True">开启（减少步骤，更快响应）</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary" id="btn-save">
          <i class="fa-solid fa-floppy-disk"></i> 保存配置
        </button>
        <button type="button" class="btn-ghost" id="btn-test">
          <i class="fa-solid fa-plug"></i> 测试连接
        </button>
        <button type="button" class="btn-ghost" id="btn-reload">
          <i class="fa-solid fa-arrows-rotate"></i> 重新加载
        </button>
      </div>

      <div id="connection-status" style="margin-top: 16px;"></div>
      <div class="env-path" id="env-path">配置文件路径：加载中…</div>
    </form>
  </main>

  <script>
    const API_BASE = "/api/netheal/v1";

    function $(id) { return document.getElementById(id); }

    function toast(msg, type) {
      const el = document.createElement("div");
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    // Load current config
    async function loadConfig() {
      try {
        const resp = await fetch(`${API_BASE}/config/api`);
        const data = await resp.json();
        const cfg = data.config || {};

        Object.keys(cfg).forEach((key) => {
          const input = document.querySelector(`[name="${key}"]`);
          if (input) input.value = cfg[key] || "";
        });

        // Show env path
        $("env-path").textContent = `配置文件：${data.env_path || "未找到"}`;

        // Show placeholder warning
        if (data.is_placeholder) {
          $("connection-status").innerHTML = `
            <span class="status-badge status-warn">
              <i class="fa-solid fa-triangle-exclamation"></i> API Key 为模板占位符，请填入真实 Key 后保存
            </span>`;
        } else if (cfg.API_KEY && !cfg.API_KEY.includes("****")) {
          $("connection-status").innerHTML = `
            <span class="status-badge status-ok">
              <i class="fa-solid fa-circle-check"></i> API Key 已配置
            </span>`;
        }
      } catch (err) {
        toast("加载配置失败: " + err.message, "error");
      }
    }

    // Save config
    $("config-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("btn-save");
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 保存中…';

      const data = {};
      new FormData($("config-form")).forEach((value, key) => {
        data[key] = value;
      });

      try {
        const resp = await fetch(`${API_BASE}/config/api`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const result = await resp.json();
        if (resp.ok) {
          toast(result.message || "配置已保存", "success");
          $("connection-status").innerHTML = `
            <span class="status-badge status-ok">
              <i class="fa-solid fa-circle-check"></i> ${result.message || "已保存"}。请重启服务使配置生效。
            </span>`;
          await loadConfig();
        } else {
          toast(result.detail || "保存失败", "error");
        }
      } catch (err) {
        toast("保存失败: " + err.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 保存配置';
      }
    });

    // Test connection
    $("btn-test").addEventListener("click", async () => {
      $("connection-status").innerHTML = `
        <span class="status-badge status-warn">
          <i class="fa-solid fa-spinner fa-spin"></i> 正在测试模型连通性…
        </span>`;

      const API_KEY = $("API_KEY").value;
      const API_BASE_URL = $("API_BASE_URL").value;

      if (!API_KEY || API_KEY.includes("如：") || API_KEY.length < 10) {
        $("connection-status").innerHTML = `
          <span class="status-badge status-error">
            <i class="fa-solid fa-xmark"></i> 请先填写有效的 API Key
          </span>`;
        return;
      }

      try {
        const resp = await fetch(`${API_BASE_URL}/models`, {
          headers: { "Authorization": `Bearer ${API_KEY}` },
        });

        if (resp.ok) {
          const data = await resp.json();
          const models = (data.data || []).slice(0, 5).map(m => m.id).join(", ");
          $("connection-status").innerHTML = `
            <span class="status-badge status-ok">
              <i class="fa-solid fa-circle-check"></i> 连接成功！可用模型: ${models || "已连接"}
            </span>`;
        } else if (resp.status === 401) {
          $("connection-status").innerHTML = `
            <span class="status-badge status-error">
              <i class="fa-solid fa-lock"></i> API Key 认证失败 (401)，请检查 Key 是否正确
            </span>`;
        } else {
          $("connection-status").innerHTML = `
            <span class="status-badge status-error">
              <i class="fa-solid fa-triangle-exclamation"></i> 服务器返回 ${resp.status}，请检查 API 地址
            </span>`;
        }
      } catch (err) {
        $("connection-status").innerHTML = `
          <span class="status-badge status-error">
            <i class="fa-solid fa-plug-circle-xmark"></i> 无法连接: ${err.message}
          </span>`;
      }
    });

    // Reload
    $("btn-reload").addEventListener("click", loadConfig);

    // Show/hide password
    document.querySelectorAll('input[type="password"]').forEach((input) => {
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.innerHTML = '<i class="fa-solid fa-eye"></i>';
      toggle.style.cssText = "position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;";
      const wrapper = document.createElement("div");
      wrapper.style.cssText = "position:relative;width:100%;";
      input.parentNode.insertBefore(wrapper, input);
      wrapper.appendChild(input);
      wrapper.appendChild(toggle);
      toggle.addEventListener("click", () => {
        input.type = input.type === "password" ? "text" : "password";
        toggle.innerHTML = input.type === "password" ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
      });
    });

    loadConfig();
  </script>
</body>
</html>
